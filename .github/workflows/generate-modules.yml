name: Generate modules.json

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/generate-modules-json.mjs"
      - "json/config.json"
      - ".github/workflows/generate-modules.yml"

permissions:
  contents: write

concurrency:
  group: generate-modules-json
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate modules.json from repo.mmrl.dev
        env:
          API_BASE_URL: ${{ secrets.MMRL_API_BASE_URL }}
          API_KEY: ${{ secrets.MMRL_API_KEY }}
          RAW_BASE_URL: https://raw.githubusercontent.com/MMRLApp/repo/refs/heads/master/
          OUTPUT_PATH: json/modules.json
          META_PATH: json/config.json
        run: node scripts/generate-modules-json.mjs

      - name: Generate modules.json from modules.kernelsu.org
        env:
          RAW_BASE_URL: https://raw.githubusercontent.com/MMRLApp/repo/refs/heads/master/
          OUTPUT_PATH: ksu/json/modules.json
          MODULES_PATH: ksu/modules
          META_PATH: ksu/json/config.json
        run: node scripts/generate-ksu-modules-json.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: regenerate modules.json [skip ci]"
          git push
